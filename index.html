<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0G Shop - Premium DeAI Merch Hub</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <!-- CSP Cải thiện: Loại bỏ dần các nguồn không cần thiết và chuẩn hóa -->
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self' https://*.privy.io; 
                   script-src 'self' https://auth.privy.io https://*.privy.io https://www.gstatic.com https://cdn.jsdelivr.net https://*.firebasedatabase.app 'unsafe-inline' 'unsafe-eval'; 
                   style-src 'self' 'unsafe-inline' https://*.privy.io; 
                   img-src 'self' data: https://script.google.com https://*.privy.io; 
                   connect-src 'self' https://auth.privy.io https://*.privy.io https://*.firebasedatabase.app wss://*.firebasedatabase.app wss://*.privy.io https://www.gstatic.com;">

    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://auth.privy.io/widget/index.js"></script>

    <style>
        /* Giữ nguyên phần CSS của bạn */
        :root { --0g-cyan: #00f5ff; --0g-yellow: #f0b90b; --bg-dark: #0b0e11; --neon-glow: 0 0 15px rgba(0, 245, 255, 0.4); }
        body { font-family: 'Segoe UI', sans-serif; background: #0b0e11; color: #eaecef; margin: 0; text-align: center; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 50px; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(0, 245, 255, 0.2); }
        .logo-text { font-weight: 900; color: var(--0g-cyan); font-size: 1.6rem; text-shadow: var(--neon-glow); }
        #connect-btn { background: transparent; border: 1.5px solid var(--0g-cyan); color: var(--0g-cyan); padding: 8px 20px; border-radius: 50px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        #connect-btn:hover { background: var(--0g-cyan); color: #000; box-shadow: var(--neon-glow); }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; max-width: 1400px; margin: 0 auto; padding: 30px 50px; }
        .product-card { border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 25px; padding: 20px; background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(10px); transition: 0.5s; }
        .btn-buy { width: 100%; background: var(--0g-cyan); color: #000; border: none; padding: 12px 0; border-radius: 12px; font-weight: 900; cursor: pointer; }
        #order-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #0b0e11; border: 2px solid var(--0g-cyan); padding: 25px; border-radius: 20px; z-index: 2000; width: 90%; max-width: 400px; }
        #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1999; }
    </style>
</head>
<body>

    <header>
        <div class="logo-text">SIC-0G MERCH</div>
        <div id="wallet-container">
            <!-- Đã xóa onclick, sẽ gán qua ID trong JS -->
            <button id="connect-btn">CONNECT WALLET</button>
            <div id="wallet-info" style="display:none; align-items: center; gap: 10px;">
                <div id="wallet-address" style="color: #39d353; border: 1px solid #39d353; padding: 8px 20px; border-radius: 50px; font-family: monospace;"></div>
                <button id="disconnect-btn" style="background: rgba(255, 77, 77, 0.1); border: 1px solid #ff4d4d; color: #ff4d4d; padding: 8px 15px; border-radius: 50px; cursor: pointer;">DISCONNECT</button>
            </div>
        </div>
    </header>

    <div class="product-grid">
        <!-- Mỗi nút buy thêm data attribute để JS xử lý -->
        <div class="product-card">
            <img src="ao-0g.jpg" class="product-img" alt="T-Shirt">
            <h3>0G PANDA T-SHIRT</h3>
            <div class="price">0.04 0G</div>
            <button class="btn-buy" data-amount="0.04" data-item="0G PANDA T-SHIRT">MINT NOW</button>
        </div>
        <!-- Thêm các card khác tương tự... -->
    </div>

    <div id="modal-overlay"></div>
    <div id="order-modal">
        <h2 style="color:var(--0g-cyan);">📦 SHIPPING INFO</h2>
        <input type="text" id="order-item" readonly>
        <input type="text" id="receiver-name" placeholder="Receiver Name">
        <input type="text" id="country" placeholder="Country">
        <textarea id="address" placeholder="Full Address"></textarea>
        <input type="text" id="phone" placeholder="Phone Number">
        <button id="submit-order-btn" style="width:100%; background:var(--0g-cyan); padding:12px; border-radius:10px; cursor:pointer;">CONFIRM SHIPPING</button>
        <button id="close-modal-btn" style="width:100%; background:transparent; color:#848e9c; border:none; margin-top:10px; cursor:pointer;">Maybe later</button>
    </div>

    <script>
        // Cấu hình Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCHEV_Ob-nxZSV23s5j_bFn7iYQIVTKGy8",
            authDomain: "sic-0g-shop.firebaseapp.com",
            projectId: "sic-0g-shop",
            databaseURL: "https://sic-0g-shop-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const DESTINATION_WALLET = "0xA05F0295bF972ecc37f4321A93A47df16ECD30E9";
        let privy, fullWalletAddress = "", lastTxHash = "", currentPurchasedItem = "";

        // Tách biệt logic xử lý sự kiện (Event Listeners) để tuân thủ CSP
        document.addEventListener('DOMContentLoaded', () => {
            // Nút kết nối
            document.getElementById('connect-btn').addEventListener('click', handleConnect);
            document.getElementById('disconnect-btn').addEventListener('click', handleDisconnect);
            
            // Nút đóng modal
            document.getElementById('close-modal-btn').addEventListener('click', closeModal);
            
            // Nút gửi đơn hàng
            document.getElementById('submit-order-btn').addEventListener('click', submitOrder);

            // Gán sự kiện cho tất cả nút MINT NOW
            const buyButtons = document.querySelectorAll('.btn-buy');
            buyButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const amount = btn.getAttribute('data-amount');
                    const item = btn.getAttribute('data-item');
                    initiatePayment(amount, item);
                });
            });

            initPrivy();
        });

        function initPrivy() {
            if (window.PrivyWidget) {
                privy = new PrivyWidget({
                    appId: 'cmp20fb5u009b0cjs6gy1fd16',
                    config: {
                        loginMethods: ['google', 'email', 'wallet'],
                        embeddedWallets: { createOnLogin: 'users-without-wallets', noPromptOnSignature: true },
                        appearance: { theme: 'dark', accentColor: '#00f5ff' }
                    }
                });
            }
        }

        async function handleConnect() {
            if (!privy) return;
            try {
                const user = await privy.login();
                if (user && user.wallet) {
                    fullWalletAddress = user.wallet.address;
                    document.getElementById('connect-btn').style.display = 'none';
                    document.getElementById('wallet-info').style.display = 'flex';
                    document.getElementById('wallet-address').innerText = fullWalletAddress.substring(0, 6) + "..." + fullWalletAddress.slice(-4);
                }
            } catch (e) { console.error("Login failed", e); }
        }

        function handleDisconnect() {
            if (privy) privy.logout();
            location.reload();
        }

        async function initiatePayment(amount, itemName) {
            if (!fullWalletAddress) {
                await handleConnect();
                if (!fullWalletAddress) return;
            }
            try {
                const provider = new ethers.providers.Web3Provider(window.ethereum || privy.provider);
                const signer = provider.getSigner();
                currentPurchasedItem = itemName;

                const tx = await signer.sendTransaction({
                    to: DESTINATION_WALLET,
                    value: ethers.utils.parseEther(amount.toString())
                });

                lastTxHash = tx.hash;
                await tx.wait();
                
                document.getElementById('order-item').value = itemName;
                document.getElementById('order-modal').style.display = 'block';
                document.getElementById('modal-overlay').style.display = 'block';
            } catch (e) { alert("Payment error. Please check your wallet."); }
        }

        async function submitOrder() {
            const orderData = {
                wallet: fullWalletAddress,
                item: currentPurchasedItem,
                receiver: document.getElementById('receiver-name').value,
                address: document.getElementById('address').value,
                txHash: lastTxHash,
                timestamp: Date.now()
            };

            if(!orderData.receiver || !orderData.address) return alert("Fill all fields");

            await database.ref('orders/').push(orderData);
            alert("Order success!");
            closeModal();
        }

        function closeModal() {
            document.getElementById('order-modal').style.display = 'none';
            document.getElementById('modal-overlay').style.display = 'none';
        }
    </script>
</body>
</html>
