<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CẤU HÌNH CSP QUAN TRỌNG: Giải quyết lỗi "blocks the use of eval" trong image_fd415e.png -->
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; script-src * 'unsafe-inline' 'unsafe-eval' blob:; connect-src * 'unsafe-inline'; img-src * data: blob:; frame-src *; worker-src blob:;">
    
    <title>0G Shop - Premium DeAI Merch Hub</title>
    
    <!-- Thư viện hỗ trợ -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <!-- Privy SDK -->
    <script src="https://unpkg.com/@privy-io/js-sdk@latest/dist/privy.umd.js"></script>

    <style>
        :root {
            --0g-cyan: #00f5ff;
            --0g-yellow: #f0b90b;
            --neon-glow: 0 0 15px rgba(0, 245, 255, 0.4);
        }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #0b0e11; color: #eaecef; margin: 0; text-align: center;
        }
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 50px; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(20px);
            position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(0, 245, 255, 0.2);
        }
        .logo-text { font-weight: 900; color: var(--0g-cyan); font-size: 1.6rem; }
        #connect-btn {
            background: transparent; border: 1.5px solid var(--0g-cyan); color: var(--0g-cyan);
            padding: 8px 20px; border-radius: 50px; font-weight: bold; cursor: pointer;
        }
        .main-title { color: var(--0g-cyan); font-size: 3rem; margin-top: 50px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 50px; }
        .product-card { border: 1px solid rgba(255, 255, 255, 0.1); padding: 20px; border-radius: 20px; background: rgba(255,255,255,0.02); }
        .price { font-size: 20px; color: var(--0g-yellow); margin: 10px 0; }
        .btn-buy { background: var(--0g-cyan); border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; }
        
        #order-modal, #modal-overlay { display: none; }
        #modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; }
        #order-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1f2e; padding: 30px; border-radius: 20px; z-index: 1001; width: 90%; max-width: 400px; border: 1px solid var(--0g-cyan); }
        input, textarea { width: 100%; margin-bottom: 10px; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #0b0e11; color: white; box-sizing: border-box; }
    </style>
</head>
<body>

    <header>
        <div class="logo-text">SIC-0G SHOP</div>
        <div id="wallet-container">
            <button id="connect-btn" onclick="handleConnect()">SIGN IN / CONNECT</button>
            <div id="wallet-info" style="display:none; align-items: center; gap: 10px;">
                <span id="wallet-address" style="color: #39d353; font-family: monospace;"></span>
                <button onclick="handleDisconnect()" style="color: #ff4d4d; background: none; border: none; cursor: pointer;">LOGOUT</button>
            </div>
        </div>
    </header>

    <h1 class="main-title">0G MERCH HUB</h1>

    <div class="product-grid">
        <!-- Ví dụ 1 sản phẩm, bạn có thể copy thêm -->
        <div class="product-card">
            <h3>0G PANDA T-SHIRT</h3>
            <div class="price">0.04 0G</div>
            <button class="btn-buy" onclick="initiatePayment(0.04, '0G PANDA T-SHIRT')">MINT NOW</button>
        </div>
    </div>

    <div id="modal-overlay"></div>
    <div id="order-modal">
        <h2 style="color:var(--0g-cyan)">SHIPPING INFO</h2>
        <input type="text" id="order-item" readonly>
        <input type="text" id="receiver-name" placeholder="Receiver Name">
        <input type="text" id="phone" placeholder="Phone Number">
        <textarea id="address" placeholder="Full Address"></textarea>
        <button onclick="submitOrder()" class="btn-buy">CONFIRM ORDER</button>
    </div>

    <script>
        // --- CẤU HÌNH ---
        const DESTINATION_WALLET = "0xA05F0295bF972ecc37f4321A93A47df16ECD30E9";
        const PROXY_URL = 'https://script.google.com/macros/s/AKfycbzoPZZbkaCE4lNjfiUNbwpPgKlIDIKgt54Udv_IVCLICoZb0RYsV3ZTTFxXqISq0ajKLw/exec';

        const firebaseConfig = {
            apiKey: "AIzaSyCHEV_Ob-nxZSV23s5j_bFn7iYQIVTKGy8",
            authDomain: "sic-0g-shop.firebaseapp.com",
            projectId: "sic-0g-shop",
            databaseURL: "https://sic-0g-shop-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let privy;
        let fullWalletAddress = "";
        let currentItem = "";
        let currentTx = "";

        // --- KHỞI TẠO AN TOÀN ---
        function initPrivy() {
            const PrivySDK = window.Privy?.PrivyClient || window.Privy;
            if (PrivySDK) {
                try {
                    privy = new (PrivySDK.PrivyClient || PrivySDK)({
                        appId: 'YOUR_PRIVY_APP_ID', // <--- THAY ID CỦA BẠN
                        config: {
                            loginMethods: ['google', 'wallet'],
                            embeddedWallets: { createOnLogin: 'users-without-wallets' }
                        }
                    });
                    console.log("✅ Privy Ready on 0gshop.online");
                } catch (e) { console.error("Init Error:", e); }
            } else {
                setTimeout(initPrivy, 500);
            }
        }
        window.addEventListener('load', initPrivy);

        async function handleConnect() {
            if (!privy) return alert("System loading...");
            try {
                const user = await privy.login();
                const wallet = user.linkedAccounts.find(a => a.type === 'wallet');
                if (wallet) {
                    fullWalletAddress = wallet.address;
                    document.getElementById('connect-btn').style.display = 'none';
                    document.getElementById('wallet-info').style.display = 'flex';
                    document.getElementById('wallet-address').innerText = wallet.address.slice(0,6) + "...";
                }
            } catch (e) { console.error(e); }
        }

        async function handleDisconnect() {
            if (privy) await privy.logout();
            location.reload();
        }

        async function initiatePayment(amount, name) {
            if (!fullWalletAddress) return handleConnect();
            try {
                const wallets = await privy.getWallets();
                const provider = await wallets[0].getEthersProvider();
                const signer = provider.getSigner();
                
                const tx = await signer.sendTransaction({
                    to: DESTINATION_WALLET,
                    value: ethers.utils.parseEther(amount.toString())
                });
                
                currentTx = tx.hash;
                currentItem = name;
                alert("Transaction Sent! Please wait...");
                await tx.wait();
                
                document.getElementById('order-item').value = name;
                document.getElementById('order-modal').style.display = 'block';
                document.getElementById('modal-overlay').style.display = 'block';
            } catch (e) { alert("Payment Failed"); }
        }

        async function submitOrder() {
            const data = {
                wallet: fullWalletAddress,
                item: currentItem,
                receiver: document.getElementById('receiver-name').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                txHash: currentTx,
                timestamp: Date.now()
            };
            await database.ref('orders/').push(data);
            
            // Alert Telegram qua Image Beacon (Tránh lỗi CORS)
            const msg = `📦 NEW ORDER: ${data.item}\n👤 ${data.receiver}\n📞 ${data.phone}\n🔗 ${data.txHash}`;
            new Image().src = `${PROXY_URL}?message=${encodeURIComponent(msg)}`;
            
            alert("Order Success!");
            location.reload();
        }
    </script>
</body>
</html>
